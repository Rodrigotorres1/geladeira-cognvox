services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      # Sobrescreve o DATABASE_URL do .env: dentro do container o banco
      # fica em ./data (montada como volume nomeado abaixo), para persistir
      # entre "docker compose down"/"up" sem depender do FS do host.
      DATABASE_URL: sqlite:///./data/cilindros.db
    volumes:
      - backend_data:/app/data

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      # O navegador chama /api no proprio frontend (igual em producao) e o
      # proxy do Vite repassa para o backend pela rede interna do compose.
      # "localhost" aqui seria o proprio container do frontend.
      API_PROXY_TARGET: http://backend:8000
    depends_on:
      - backend

volumes:
  backend_data:
